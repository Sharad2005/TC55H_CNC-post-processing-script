name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test post logic
        run: node tests/test_tc55h_cps.js
      - name: Test output validator
        run: python -m unittest discover -s tests -p 'test_*.py'
